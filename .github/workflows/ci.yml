name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/agents

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/agents/go.mod
          cache: true
          cache-dependency-path: apps/agents/go.sum

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -ldflags="-s -w" -v -o mewagents .
